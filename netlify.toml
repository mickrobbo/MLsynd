[build]
  # Strips comments/whitespace into dist/ on every deploy (see build.mjs).
  # GitHub keeps the readable source. If the build ever fails, Netlify keeps
  # serving the previous deploy, so the live site can't break from this.
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
