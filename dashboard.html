<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MLSynd Dashboard</title>
<meta name="theme-color" content="#0B2B22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MLSynd">
<link rel="manifest" href="dashboard-manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #08130F; --felt: #0B2B22; --felt-2: #123626; --felt-3: #17402D;
    --line: rgba(239,234,216,0.12); --brass: #C7A248; --brass-dim: #7d6a34;
    --chalk: #EFEAD8; --muted: #93a89c; --win: #6FA98A; --loss: #C1604A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background: var(--ink); color: var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    padding-top: 16px;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    min-height:100vh;
  }
  .wrap{ max-width: 720px; margin:0 auto; padding: 0 12px; }

  header{ text-align:center; margin-bottom:16px; }
  header h1{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:20px;
    letter-spacing:3px; text-transform:uppercase; color: var(--brass); margin:0;
  }

  .toteboard-strip{ display:flex; gap:8px; margin-bottom:16px; }
  .toteboard-cell{
    flex:1; background: var(--felt-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 8px; text-align:center;
  }
  .toteboard-cell .lbl{
    font-family:'Barlow Condensed', sans-serif; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color: var(--muted); display:block; margin-bottom:2px;
  }
  .toteboard-cell .val{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:18px; color: var(--chalk);
  }
  .toteboard-cell.pos .val{ color: var(--win); }
  .toteboard-cell.neg .val{ color: var(--loss); }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background: linear-gradient(0deg, var(--felt) 0%, var(--felt-2) 100%);
    border-top:1px solid var(--brass-dim);
    display:flex; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--muted);
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  }
  .tab-btn .icon{ font-size:18px; line-height:1; }
  .tab-btn.active{ color: var(--brass); }
  .tab-btn.active .icon{ filter: drop-shadow(0 0 6px rgba(199,162,72,.5)); }

  .panel{
    background: var(--felt-2); border:1px solid var(--line); border-radius:10px;
    padding:16px; margin-bottom:14px; overflow-x:auto;
  }
  .panel h2{
    font-family:'Barlow Condensed', sans-serif; font-size:15px; font-weight:700;
    text-transform:uppercase; letter-spacing:1.5px; color: var(--brass); margin:0 0 10px;
  }

  table{ width:100%; border-collapse:collapse; font-size:12px; min-width:520px; }
  th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:1px; color:var(--muted);
    border-bottom:1px solid var(--brass-dim); padding:7px 6px; white-space:nowrap;
  }
  td{ padding:7px 6px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  td.name{ font-weight:600; color:var(--chalk); }
  tr.rank-1 td.name{ color: var(--brass); }
  .pos{ color: var(--win); } .neg{ color: var(--loss); }

  .fin-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .fin-row:last-child{ border-bottom:none; }
  .fin-row .lbl{ color: var(--muted); }

  .balance-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .balance-grid .toteboard-cell{ padding:12px 6px; }
  .balance-grid .val{ font-size:15px; }

  .owed-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .owed-row:last-child{ border-bottom:none; }
  .owed-row .name{ font-weight:600; }
  .owed-row .amt{ color: var(--muted); }
  .owed-row .amt.due{ color: var(--loss); font-weight:600; }

  .highlight-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .highlight-row:last-child{ border-bottom:none; }
  .highlight-row .hl-lbl{ color: var(--muted); flex-shrink:0; }
  .highlight-row .hl-detail{ text-align:right; }
  .highlight-row .hl-name{ font-weight:700; color: var(--brass); }
  .highlight-row .hl-week{ color: var(--muted); font-size:10px; display:block; }

  .slip-card{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .slip-card:last-child{ border-bottom:none; }
  .slip-thumb{
    width:48px; height:48px; flex-shrink:0; border-radius:6px; overflow:hidden;
    background:#060A08; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  }
  .slip-thumb img{ width:100%; height:100%; object-fit:cover; }
  .slip-icon{ font-size:20px; }
  .slip-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .slip-info a{ color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:12px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slip-info a:hover{ color:var(--brass); }
  .slip-date{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); }

  .afl-game{
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    font-family:'IBM Plex Mono', monospace;
  }
  .afl-game.live{ border-color: var(--brass); }
  .afl-teams{ display:flex; justify-content:space-between; align-items:center; padding:3px 0; }
  .afl-teams .team{ font-size:13px; color:var(--chalk); }
  .afl-teams .score{ font-size:16px; font-weight:700; color:var(--chalk); }
  .afl-status{
    text-align:center; font-size:10px; color:var(--brass); text-transform:uppercase;
    letter-spacing:1px; padding:3px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    margin:4px 0;
  }
  .afl-venue{ font-size:10px; color:var(--muted); text-align:center; margin-top:2px; }

  .status-bar{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px;
    color: var(--muted); margin-top:4px;
  }
  .chart-wrap{ overflow-x:auto; }
  .chart-wrap svg{ display:block; }
  .empty{ text-align:center; padding:20px 10px; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .hint{ font-size:11px; color: var(--muted); line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MLSynd Ledger</h1>
  </header>

  <div class="tab-panel active" id="tab-balance">
    <div class="panel">
      <h2>Rolling balance</h2>
      <div class="balance-grid">
        <div class="toteboard-cell" id="balBankCell"><span class="lbl">Bank</span><span class="val" id="balBank">$0</span></div>
        <div class="toteboard-cell"><span class="lbl">Outlay</span><span class="val" id="balOutlay">$0</span></div>
        <div class="toteboard-cell"><span class="lbl">Return</span><span class="val" id="balReturn">$0</span></div>
        <div class="toteboard-cell"><span class="lbl">Bonus pot</span><span class="val" id="balPot">$0</span></div>
        <div class="toteboard-cell" id="balPlOverallCell"><span class="lbl">P/L overall</span><span class="val" id="balPlOverall">$0</span></div>
        <div class="toteboard-cell" id="balPlWeeklyCell"><span class="lbl">P/L weekly</span><span class="val" id="balPlWeekly">$0</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Highlights</h2>
      <div id="highlightsArea"></div>
    </div>

    <div class="panel">
      <h2>Season P/L</h2>
      <div id="chartArea"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-board">
    <div class="panel">
      <h2>Leaderboard</h2>
      <div id="leaderboardArea"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-owed">
    <div class="panel">
      <h2>Money owed</h2>
      <div id="owedArea"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-slips">
    <div class="panel">
      <h2>Bet slips</h2>
      <div id="slipsArea"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-afl">
    <div class="panel">
      <h2>AFL Scores <span style="font-family:'IBM Plex Sans', sans-serif; font-weight:400; text-transform:none; letter-spacing:0; font-size:11px; color:var(--muted);">— live via Squiggle</span></h2>
      <div id="aflArea">Loading…</div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Loading…</div>
</div>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="balance"><span class="icon">⚖️</span>Balance</button>
  <button class="tab-btn" data-tab="board"><span class="icon">🏆</span>Board</button>
  <button class="tab-btn" data-tab="owed"><span class="icon">💰</span>Owed</button>
  <button class="tab-btn" data-tab="slips"><span class="icon">📎</span>Slips</button>
  <button class="tab-btn" data-tab="afl"><span class="icon">🏉</span>AFL</button>
</nav>

<script>
const FIREBASE_URL = 'https://mlsynd-default-rtdb.firebaseio.com';
const DATA_PATH = '/state.json';

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
const IMAGE_EXT = /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i;

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function fmtMoney(n){
  const v = Number(n) || 0;
  const sign = v > 0 ? '+' : (v < 0 ? '-' : '');
  return sign + '$' + Math.abs(v).toFixed(2);
}
function computeDerived(m){
  const winPct = (m.wins + m.losses) > 0 ? m.wins / (m.wins + m.losses) : 0;
  const avgLeg = m.oddsCount > 0 ? m.oddsSum / m.oddsCount : 0;
  const indBets = m.indWin + m.indLoss;
  const indWinPct = indBets > 0 ? m.indWin / indBets : 0;
  const dataScore = Math.round(((m.pl/25) + (winPct*10) + (indWinPct*5) + (m.legs*0.5) + (avgLeg*1)) * 100) / 100;
  return { winPct, avgLeg, indWinPct, dataScore };
}
function rankedMembers(members){
  const withDerived = members.map(m => ({ ...m, ...computeDerived(m) }));
  withDerived.sort((a,b) => b.dataScore - a.dataScore);
  return withDerived;
}
function computeSeasonFinancials(state){
  const g = state.group;
  const outlay = g.lottoOut + g.multiOut;
  const ret = g.lottoRet + g.multiRet;
  const profitLoss = ret - (outlay + g.bonus);
  const duesCollected = state.members.reduce((s, m) => s + (m.duesCommitment - m.duesOwed), 0);
  const duesOwedTotal = state.members.reduce((s, m) => s + m.duesOwed, 0);
  const bank = duesCollected + profitLoss;
  return { outlay, ret, profitLoss, bonusPot: g.bonus, duesCollected, duesOwedTotal, bank };
}

function weekGroupPl(h){
  const g = h.group || {};
  const outlay = (g.lottoOut||0) + (g.multiOut||0) + (g.bonus||0);
  const ret = (g.lottoRet||0) + (g.multiRet||0);
  return ret - outlay;
}

function computeHighlights(history){
  let bestGroupWin = null;   // highest-odds group leg that won
  let worstGroupLoss = null; // lowest-odds group leg that still lost (the bad beat)
  let bestIndWin = null;     // biggest single individual bet P/L

  (history || []).forEach(h => {
    const ge = h.groupEntries || {};
    Object.entries(ge).forEach(([name, e]) => {
      if(!e || e.odds === null || e.odds === undefined) return;
      if(e.result === 'Win' && (!bestGroupWin || e.odds > bestGroupWin.odds)){
        bestGroupWin = { name, odds: e.odds, week: h.label };
      }
      if(e.result === 'Loss' && (!worstGroupLoss || e.odds < worstGroupLoss.odds)){
        worstGroupLoss = { name, odds: e.odds, week: h.label };
      }
    });
    const ie = h.individualEntries || {};
    Object.entries(ie).forEach(([name, e]) => {
      if(!e || !(e.pl > 0)) return;
      if(!bestIndWin || e.pl > bestIndWin.pl){
        bestIndWin = { name, pl: e.pl, week: h.label };
      }
    });
  });

  return { bestGroupWin, worstGroupLoss, bestIndWin };
}

function shortWeekLabel(label){
  const m = (label || '').match(/(\d+)/);
  return m ? 'W' + m[1] : (label || '').slice(0, 4);
}

function buildChart(history){
  if(!history || history.length === 0){
    return '<div class="empty">No weeks saved yet — this fills in as you save each week.</div>';
  }
  // cumulative running P/L over the season, not per-week deltas
  let running = 0;
  const points = history.map(h => { running += weekGroupPl(h); return { label: h.label, cum: running }; });

  const chartW = 320, chartH = 130, padX = 12, padY = 10;
  const values = points.map(p => p.cum);
  const maxV = Math.max(0, ...values);
  const minV = Math.min(0, ...values);
  const range = Math.max(1, maxV - minV);
  const stepX = points.length > 1 ? (chartW - padX*2) / (points.length - 1) : 0;
  const yFor = v => chartH - padY - ((v - minV) / range) * (chartH - padY*2);
  const zeroY = yFor(0);

  const coords = points.map((p, i) => [padX + i*stepX, yFor(p.cum)]);
  const linePath = coords.map((c, i) => (i===0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaPath = `${linePath} L${coords[coords.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${coords[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`;

  const finalPl = points[points.length-1].cum;
  const lineColor = finalPl >= 0 ? 'var(--win)' : 'var(--loss)';
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${lineColor}"/>`).join('');

  // label first, middle, last week only, to avoid clutter
  const labelIdxs = points.length > 1 ? [0, Math.floor((points.length-1)/2), points.length-1] : [0];
  const labels = [...new Set(labelIdxs)].map(i => {
    const c = coords[i];
    return `<text x="${c[0].toFixed(1)}" y="${chartH + 12}" font-size="8" fill="var(--muted)" text-anchor="middle" font-family="'IBM Plex Mono', monospace">${escapeHtml(shortWeekLabel(points[i].label))}</text>`;
  }).join('');

  return `<div class="chart-wrap"><svg viewBox="0 0 ${chartW} ${chartH + 20}" width="100%" height="${chartH + 20}" preserveAspectRatio="none" style="min-width:280px;">
    <line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${chartW-padX}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <path d="${areaPath}" fill="${lineColor}" opacity="0.12" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg></div>`;
}

function render(state){
  if(!state || !state.members || state.members.length === 0){
    document.getElementById('leaderboardArea').innerHTML = '';
    document.getElementById('owedArea').innerHTML = '';
    document.getElementById('slipsArea').innerHTML = '';
    document.getElementById('highlightsArea').innerHTML = '';
    document.getElementById('chartArea').innerHTML = '<div class="empty">No data yet — waiting for the first entry.</div>';
    return;
  }
  const fin = computeSeasonFinancials(state);
  const totalPl = state.members.reduce((s, m) => s + m.pl, 0);
  const history = state.history || [];
  const lastWeek = history.length ? history[history.length - 1] : null;
  const weeklyPl = lastWeek ? weekGroupPl(lastWeek) : 0;

  document.getElementById('balBank').textContent = fmtMoney(fin.bank).replace('+','');
  document.getElementById('balBankCell').className = 'toteboard-cell ' + (fin.bank >= 0 ? 'pos' : 'neg');
  document.getElementById('balOutlay').textContent = '$' + (fin.outlay + fin.bonusPot).toFixed(2);
  document.getElementById('balReturn').textContent = '$' + fin.ret.toFixed(2);
  document.getElementById('balPot').textContent = '$' + fin.bonusPot.toFixed(2);
  document.getElementById('balPlOverall').textContent = fmtMoney(fin.profitLoss).replace('+','');
  document.getElementById('balPlOverallCell').className = 'toteboard-cell ' + (fin.profitLoss >= 0 ? 'pos' : 'neg');
  document.getElementById('balPlWeekly').textContent = fmtMoney(weeklyPl).replace('+','');
  document.getElementById('balPlWeeklyCell').className = 'toteboard-cell ' + (weeklyPl >= 0 ? 'pos' : 'neg');

  document.getElementById('chartArea').innerHTML = buildChart(history);

  const hl = computeHighlights(history);
  const hlRow = (label, data, fmt) => {
    if(!data) return `<div class="highlight-row"><span class="hl-lbl">${label}</span><span class="hl-detail" style="color:var(--muted);">No data yet</span></div>`;
    return `<div class="highlight-row">
      <span class="hl-lbl">${label}</span>
      <span class="hl-detail"><span class="hl-name">${escapeHtml(data.name)}</span> — ${fmt(data)}<span class="hl-week">${escapeHtml(data.week || '')}</span></span>
    </div>`;
  };
  document.getElementById('highlightsArea').innerHTML =
    hlRow('Best group leg win', hl.bestGroupWin, d => `@ ${d.odds.toFixed(2)}`) +
    hlRow('Worst group leg loss', hl.worstGroupLoss, d => `@ ${d.odds.toFixed(2)}`) +
    hlRow('Best individual bet win', hl.bestIndWin, d => fmtMoney(d.pl));

  const ranked = rankedMembers(state.members);
  let html = '<table><tr><th>#</th><th>Name</th><th>Score</th><th>P/L</th><th>W-L-V</th><th>Win%</th><th>Ind W-L</th></tr>';
  ranked.forEach((m, i) => {
    const rank = i + 1;
    html += `<tr class="${rank===1?'rank-1':''}">
      <td>${rank}</td>
      <td class="name">${escapeHtml(m.name)}</td>
      <td>${m.dataScore.toFixed(2)}</td>
      <td class="${m.pl>=0?'pos':'neg'}">${fmtMoney(m.pl)}</td>
      <td>${m.wins}-${m.losses}-${m.voids}</td>
      <td>${(m.winPct*100).toFixed(0)}%</td>
      <td>${m.indWin}-${m.indLoss}</td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('leaderboardArea').innerHTML = html;

  const owedSorted = [...state.members].sort((a,b) => b.duesOwed - a.duesOwed);
  let owedHtml = '';
  owedSorted.forEach(m => {
    const owed = Math.round(m.duesOwed);
    const commitment = Math.round(m.duesCommitment);
    owedHtml += `<div class="owed-row">
      <span class="name">${escapeHtml(m.name)}</span>
      <span class="amt ${owed>0?'due':''}">$${owed} of $${commitment}</span>
    </div>`;
  });
  document.getElementById('owedArea').innerHTML = owedHtml || '<div class="empty">No members yet.</div>';

  const slips = state.slips || [];
  if(slips.length === 0){
    document.getElementById('slipsArea').innerHTML = '<div class="empty">No slips added yet.</div>';
  } else {
    let slipHtml = '';
    [...slips].reverse().forEach(s => {
      slipHtml += `<div class="slip-card">
        <div class="slip-thumb">${IMAGE_EXT.test(s.url) ? `<img src="${escapeHtml(s.url)}" alt="${escapeHtml(s.label)}">` : `<span class="slip-icon">🔗</span>`}</div>
        <div class="slip-info">
          <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.label || s.url)}</a>
          <span class="slip-date">${new Date(s.addedAt).toLocaleDateString()}</span>
        </div>
      </div>`;
    });
    document.getElementById('slipsArea').innerHTML = slipHtml;
  }
}

async function refresh(){
  const statusBar = document.getElementById('statusBar');
  try{
    const res = await fetch(`${FIREBASE_URL}${DATA_PATH}?_=${Date.now()}`, { cache: 'no-store' });
    if(res.ok){
      const remote = await res.json();
      if(remote){
        render(remote);
        statusBar.textContent = 'Last updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      } else {
        statusBar.textContent = 'Waiting for the ledger\'s first save…';
      }
    } else {
      statusBar.textContent = 'Could not reach the ledger data.';
    }
  }catch(e){
    statusBar.textContent = 'Could not reach the ledger data.';
  }
}

// ---------- Tabs ----------
function setActiveTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
});

async function refreshAfl(){
  const area = document.getElementById('aflArea');
  try{
    const res = await fetch('/.netlify/functions/afl-scores', { cache: 'no-store' });
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const games = data.games || [];
    if(games.length === 0){
      area.innerHTML = '<div class="empty">No AFL games right now.</div>';
      return;
    }
    let html = '';
    games.forEach(g => {
      const live = g.complete > 0 && g.complete < 100;
      html += `<div class="afl-game ${live ? 'live' : ''}">
        <div class="afl-teams"><span class="team">${escapeHtml(g.hteam || '')}</span><span class="score">${g.hscore ?? '-'}</span></div>
        <div class="afl-status">${escapeHtml(g.timestr || (g.complete >= 100 ? 'Full Time' : ''))}</div>
        <div class="afl-teams"><span class="team">${escapeHtml(g.ateam || '')}</span><span class="score">${g.ascore ?? '-'}</span></div>
        <div class="afl-venue">${escapeHtml(g.venue || '')}</div>
      </div>`;
    });
    area.innerHTML = html;
  }catch(e){
    area.innerHTML = '<div class="empty">Could not load AFL scores.</div>';
  }
}

refresh();
setInterval(refresh, 15000); // poll every 15s for live-ish updates
refreshAfl();
setInterval(refreshAfl, 45000); // gentler polling for AFL scores, per Squiggle's usage guidelines
</script>
</body>
</html>
